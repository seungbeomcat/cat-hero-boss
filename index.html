<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>도살장 보스 현황</title>
<style>*{box-sizing:border-box}body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1b1622}.app{max-width:560px;min-height:100vh;margin:auto;background:#fff;padding:18px 14px 40px}h1{text-align:center;margin:2px 0 4px;font-size:25px}.now{text-align:center;font-weight:800;color:#716879;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:3px solid #7041df;border-radius:18px;overflow:hidden;background:#fff}.boss{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.info{text-align:center;padding:10px}.name{font-size:19px;font-weight:900}.timer{font-size:25px;font-weight:900;color:#4e269f;font-variant-numeric:tabular-nums;margin:4px 0}.sub{min-height:17px;font-size:12px;color:#777}.btns{display:flex;gap:6px;margin-top:8px}button{border:0;border-radius:10px;padding:10px 6px;font-weight:800}.btns button{flex:1}.edit,.save{background:#7041df;color:white}.done{background:#eee5ff;color:#4e269f}.history{border:3px solid #7041df;border-radius:16px;margin-top:16px;padding:12px}.history h2{font-size:17px;margin:0 0 7px}.log{font-size:13px;padding:8px 0;border-top:1px solid #e8e1ef}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{width:min(100%,560px);background:#fff;padding:18px;border-radius:20px 20px 0 0}.sheet h3{margin:0 0 12px}.lab{font-size:12px;font-weight:800;margin:9px 0 5px}.sheet input{width:100%;padding:11px;border:1px solid #cbbce5;border-radius:10px;font-size:16px}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.wide{width:100%;margin-top:11px;font-size:16px}.cancel{background:#eee;color:#333}</style></head><body><main class="app"><h1>도살장 보스 현황</h1><div id="now" class="now">현재시간 --:--:--</div><div id="grid" class="grid"></div><section class="history"><h2>최근 기록</h2><div id="history">아직 기록이 없습니다.</div></section></main>
<div id="modal" class="modal"><div class="sheet"><h3 id="title"></h3><div class="lab">입력자 닉네임</div><input id="nick"><div class="lab">인게임에 표시된 남은 시간</div><div class="times"><input id="hh" inputmode="numeric" placeholder="시간"><input id="mm" inputmode="numeric" placeholder="분"><input id="ss" inputmode="numeric" placeholder="초"></div><button id="save" class="wide save">저장</button><button id="cancel" class="wide cancel">취소</button></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";import{getFirestore,collection,doc,onSnapshot,setDoc,addDoc,serverTimestamp,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBKJT7idO3z4uBvL645uNl2XSFa8mq7IO4",authDomain:"cat-hero-boss.firebaseapp.com",projectId:"cat-hero-boss",storageBucket:"cat-hero-boss.firebasestorage.app",messagingSenderId:"1065873409630",appId:"1:1065873409630:web:109f8edbe6a818833bd6cf",measurementId:"G-4QJSQ5DFDT"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);await signInAnonymously(auth);
const bosses={louis:["루이","assets/louis.png"],looney:["루니","assets/looney.png"],luna:["루나","assets/luna.png"],bananyang:["바나냥","assets/bananyang.png"]};let data={},sel=null;const grid=document.querySelector("#grid");
function f(ms){if(ms<=0)return"팝업 가능";let x=Math.floor(ms/1000),h=Math.floor(x/3600);x%=3600;let m=Math.floor(x/60),s=x%60;return[h,m,s].map(v=>String(v).padStart(2,"0")).join(":")}
function render(){let ids=Object.keys(bosses).sort((a,b)=>(data[a]?.spawnAt?.toMillis?.()??Infinity)-(data[b]?.spawnAt?.toMillis?.()??Infinity));grid.innerHTML=ids.map(id=>{let t=data[id]?.spawnAt?.toMillis?.(),u=data[id]?.updatedBy||"";return`<article class="card"><img class="boss" src="${bosses[id][1]}"><div class="info"><div class="name">${bosses[id][0]}</div><div class="timer" data-t="${id}">${t?f(t-Date.now()):"미등록"}</div><div class="sub">${u?"최근 입력: "+u:""}</div><div class="btns"><button class="edit" data-edit="${id}">시간 입력</button><button class="done" data-done="${id}">처치 완료</button></div></div></article>`}).join("")}
onSnapshot(collection(db,"bossTimers"),s=>{data={};s.forEach(d=>data[d.id]=d.data());render()});
setInterval(()=>{document.querySelector("#now").textContent="현재시간 "+new Date().toLocaleTimeString("ko-KR",{hour12:false});document.querySelectorAll("[data-t]").forEach(e=>{let t=data[e.dataset.t]?.spawnAt?.toMillis?.();if(t)e.textContent=f(t-Date.now())})},1000);
grid.onclick=async e=>{if(e.target.dataset.edit){sel=e.target.dataset.edit;document.querySelector("#title").textContent=bosses[sel][0]+" 남은 시간 입력";document.querySelector("#modal").classList.add("on")}if(e.target.dataset.done){let n=prompt("기록자 닉네임"),p=n&&prompt("참여자 닉네임을 쉼표로 구분");if(!n||p===null)return;await addDoc(collection(db,"bossHistory"),{bossId:e.target.dataset.done,bossName:bosses[e.target.dataset.done][0],type:"defeated",recordedBy:n.trim(),participants:p.split(",").map(x=>x.trim()).filter(Boolean),createdAt:serverTimestamp()});await setDoc(doc(db,"bossTimers",e.target.dataset.done),{spawnAt:null,updatedAt:serverTimestamp(),updatedBy:n.trim()},{merge:true})}};
document.querySelector("#cancel").onclick=()=>document.querySelector("#modal").classList.remove("on");document.querySelector("#save").onclick=async()=>{let n=document.querySelector("#nick").value.trim(),h=+document.querySelector("#hh").value||0,m=+document.querySelector("#mm").value||0,s=+document.querySelector("#ss").value||0;if(!n||h+m+s<=0)return alert("닉네임과 시간을 입력해 주세요.");let at=new Date(Date.now()+(h*3600+m*60+s)*1000);await setDoc(doc(db,"bossTimers",sel),{bossName:bosses[sel][0],spawnAt:at,updatedAt:serverTimestamp(),updatedBy:n},{merge:true});await addDoc(collection(db,"bossHistory"),{bossId:sel,bossName:bosses[sel][0],type:"timer",spawnAt:at,recordedBy:n,createdAt:serverTimestamp()});document.querySelector("#modal").classList.remove("on")};
onSnapshot(query(collection(db,"bossHistory"),orderBy("createdAt","desc"),limit(20)),s=>{let a=[];s.forEach(x=>{let d=x.data();a.push(`<div class="log"><b>${d.bossName}</b> · ${d.type==="defeated"?"처치 완료":"시간 수정"} · ${d.recordedBy||"-"}${d.participants?.length?" · 참여 "+d.participants.join(", "):""}</div>`)});document.querySelector("#history").innerHTML=a.join("")||"아직 기록이 없습니다."});render();
</script></body></html>
